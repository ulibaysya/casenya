openapi: 3.2.0
info:
  version: 0.1.0
  title: user-api
paths:
  /auth/opaque/exchange:
    post:
      requestBody:
        description: Opaque token to exchange
        content:
          application/json:
            schema:
              type: string
      security: []

      responses:
        "200":
          description: Session cookies
          headers:
            Set-Cookie:
              schema:
                type: string
                example: casenya_session=ofadlMO_NEyNvGfh2EVlcg-lG0C4EorP6EJaPE1PYjM; HttpOnly; Secure; SameSite=Lax; Path=/
